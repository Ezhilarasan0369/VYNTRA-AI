<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYNTRA AI — Shared Conversation</title>
<style>
body{margin:0;background:#0b0c10;color:#eef0f5;font-family:Inter,system-ui,sans-serif}
main{width:min(860px,92vw);margin:30px auto;padding-bottom:60px}
.card{background:#14161c;border:1px solid #2c2f38;border-radius:18px;padding:22px;margin:14px 0}
h1{font-size:24px}h2{font-size:17px;margin-bottom:8px}.sub{color:#959ba8;font-size:13px}.msg{padding:14px 0;border-bottom:1px solid #282b33;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.role{font-weight:700;margin-bottom:7px}
</style>
</head>
<body><main>
<h1>VYNTRA AI</h1><div class="sub">Shared conversation</div><div id="root" class="card">Loading…</div>
<script>
const API=(location.origin.includes("github.io")? "https://vyntra-ai-api.ezhilarasanpofficial.workers.dev":"http://127.0.0.1:8787");
(async()=>{const token=new URLSearchParams(location.search).get("token");const root=document.getElementById("root");if(!token){root.textContent="Invalid share link.";return;}try{const r=await fetch(API+"/share/view?token="+encodeURIComponent(token));const d=await r.json();if(!r.ok||!d.success){root.textContent=d.error||"Share unavailable.";return;}const c=d.chat||{};root.innerHTML=`<h2>${String(c.title||"Conversation").replace(/[&<>]/g,"")}</h2>`+(c.messages||[]).map(m=>`<div class="msg"><div class="role">${m.role==="user"?"You":"VYNTRA AI"}</div><div>${String(m.content||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div></div>`).join("");}catch(e){root.textContent="Unable to load this share.";}})();
</script>
</main></body></html>
